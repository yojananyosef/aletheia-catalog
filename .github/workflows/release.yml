name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # Fuente de verdad: dist/*.amod commiteados en git (canal git+raw con CORS *).
      # Ya no se reconstruye desde la red ni se suben .amod como assets:
      # los import-*.ts se ejecutan en local y commitean el resultado.
      - name: Verificar catálogo contra módulos commiteados
        run: |
          for m in ASV KJV SME SMITH JFB WEB HITCHCOCK EASTON NAVE STRONGSGREEK STRONGSHEBREW ABBOTTSMITH ISBE TSK VINCENT APF CREEDS; do
            test -f "dist/$m.amod" || (echo "falta dist/$m.amod commiteado" && exit 1)
            sha=$(sha256sum dist/$m.amod | cut -d' ' -f1)
            cat catalog/catalog.json | grep -q "$sha" || (echo "sha256 de $m no está en catalog.json" && exit 1)
          done
          echo "catálogo verificado ✓"
      - name: Verificar releaseBase pineado al tag
        run: |
          TAG="${{ github.ref_name }}"
          EXPECTED="https://raw.githubusercontent.com/yojananyosef/aletheia-catalog/$TAG/dist"
          ACTUAL=$(python3 -c "import json;print(json.load(open('catalog/catalog.json'))['releaseBase'])")
          test "$ACTUAL" = "$EXPECTED" || (echo "releaseBase=$ACTUAL, esperado=$EXPECTED" && exit 1)
          python3 -c "
          import json,sys
          c=json.load(open('catalog/catalog.json'))
          bad=[m['id'] for m in c['modules'] if not m['downloadUrl'].startswith(c['releaseBase']+'/')]
          assert not bad, f'downloadUrl fuera de releaseBase: {bad}'
          assert 'github.com' not in c['releaseBase'], 'releaseBase sin CORS (releases) prohibido'
          "
          echo "releaseBase pineado a $TAG ✓"
      - name: Verificar CORS en el canal de distribución
        run: |
          TAG="${{ github.ref_name }}"
          BASE="https://raw.githubusercontent.com/yojananyosef/aletheia-catalog/$TAG/dist"
          # Muestra pequeña (168K) + grande (17M): el canal debe servir ambos con CORS *
          for u in "$BASE/CREEDS.amod" "$BASE/ISBE.amod"; do
            cors=$(curl -sI -o /dev/null -w '%header{access-control-allow-origin}' "$u" || true)
            test "$cors" = "*" || (echo "sin ACAO:* en $u (recibido: '$cors')" && exit 1)
          done
          # catalog.json vive en la rama, no en dist/: se verifica por separado
          cors=$(curl -sI -o /dev/null -w '%header{access-control-allow-origin}' \
            "https://raw.githubusercontent.com/yojananyosef/aletheia-catalog/$TAG/catalog/catalog.json" || true)
          test "$cors" = "*" || (echo "sin ACAO:* en catalog.json (recibido: '$cors')" && exit 1)
          echo "CORS * verificado ✓"
      # El Release conserva solo catalog.json como acta/changelog.
      # Los .amod se distribuyen vía git+raw (CORS *), no como assets.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            catalog/catalog.json
          generate_release_notes: true
      # Puntero flotante latest.json en main: las apps lo leen para ver siempre
      # la ultima version sin hardcodear el tag (con fallback a su pin si falla).
      # Las versiones siguen inmutables por tag; esto solo mueve el puntero.
      - name: Actualizar puntero latest.json en main
        run: |
          TAG="${{ github.ref_name }}"
          git fetch origin main
          git checkout main
          git pull --rebase origin main || true
          python3 - "$TAG" <<'EOF'
          import json, sys
          tag = sys.argv[1]
          assert tag.startswith('v'), f'tag inesperado: {tag}'
          ptr = {
            "format": "amf-latest-pointer",
            "version": tag[1:],
            "tag": tag,
            "catalogUrl": f"https://raw.githubusercontent.com/yojananyosef/aletheia-catalog/{tag}/catalog/catalog.json",
          }
          json.dump(ptr, open('catalog/latest.json', 'w'), indent=2)
          open('catalog/latest.json', 'a').write('\n')
          EOF
          git add catalog/latest.json
          if git diff --cached --quiet; then
            echo "latest ya apunta a $TAG"
          else
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: puntero latest -> $TAG"
            git pull --rebase origin main
            git push origin main
          fi

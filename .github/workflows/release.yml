name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # Construye los 17 módulos verificados (requiere red → CrossWire/ebible/CCEL/sacred-texts).
      # Los propios import-*.ts hacen doble build y comparan sha256 (determinismo).
      - run: bun run import --module=ASV
      - run: bun run import --module=KJV
      - run: bun run import --module=SME
      - run: bun run import --module=SMITH
      - run: bun run import --module=JFB
      - run: bun run import --module=WEB
      - run: bun run import --module=HITCHCOCK
      - run: bun run import --module=EASTON
      - run: bun run import --module=NAVE
      - run: bun run import --module=STRONGSGREEK
      - run: bun run import --module=STRONGSHEBREW
      - run: bun run import --module=ABBOTTSMITH
      - run: bun run import --module=ISBE
      - run: bun run import --module=TSK
      - run: bun run import:ccel --module=VINCENT
      - run: bun run import:ccel --module=APF
      - run: bun run import:ccel --module=CREEDS
      - run: bun run catalog
      - name: Verificar catálogo contra módulos
        run: |
          for m in ASV KJV SME SMITH JFB WEB HITCHCOCK EASTON NAVE STRONGSGREEK STRONGSHEBREW ABBOTTSMITH ISBE TSK VINCENT APF CREEDS; do
            sha=$(sha256sum dist/$m.amod | cut -d' ' -f1)
            cat catalog/catalog.json | grep -q "$sha" || (echo "sha256 de $m no está en catalog.json" && exit 1)
          done
          echo "catálogo verificado ✓"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ASV.amod
            dist/KJV.amod
            dist/SME.amod
            dist/SMITH.amod
            dist/JFB.amod
            dist/WEB.amod
            dist/HITCHCOCK.amod
            dist/EASTON.amod
            dist/NAVE.amod
            dist/STRONGSGREEK.amod
            dist/STRONGSHEBREW.amod
            dist/ABBOTTSMITH.amod
            dist/ISBE.amod
            dist/TSK.amod
            dist/VINCENT.amod
            dist/APF.amod
            dist/CREEDS.amod
            catalog/catalog.json
          generate_release_notes: true
      # El catálogo regenerado (con los shas del release) vuelve a main para que
      # la app siempre lea un catalog.json coherente con releases/latest/download.
      - name: Publicar catalog.json actualizado en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog/catalog.json
          git diff --cached --quiet && echo "sin cambios" && exit 0
          git commit -m "catalog: actualizar a ${{ github.ref_name }} [skip ci]"
          git push origin HEAD:main
